name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Put OpenSSL 3 first on PATH
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Install dash
        if: runner.os == 'Linux'
        run: command -v dash || sudo apt-get install -y dash
      - run: test/run.sh

  openssl-1_1:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git openssl
      - uses: actions/checkout@v4
      - run: test/run.sh
